name: Feed
options:
  bundleIdPrefix: com.timalpers
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Feed/Config/Debug.xcconfig
  Release: Feed/Config/Release.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    exactVersion: "2.55.1"
  Nuke:
    url: https://github.com/kean/Nuke
    exactVersion: "13.2.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Feed:
    type: application
    platform: iOS
    sources:
      - path: Feed
        excludes:
          - "Config/*.xcconfig"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
    entitlements:
      path: Feed/App/Feed.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Feed/Info.plist
      properties:
        CFBundleDisplayName: Feed
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.timalpers.shopping
            CFBundleURLSchemes: [feed]
        NSPhotoLibraryAddUsageDescription: "Save product images to your library."
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        REDIRECT_BASE_URL: $(REDIRECT_BASE_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timalpers.shopping
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FeedTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FeedTests]
    dependencies:
      - target: Feed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timalpers.shopping.tests
schemes:
  Feed:
    build:
      targets:
        Feed: all
        FeedTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [FeedTests]
